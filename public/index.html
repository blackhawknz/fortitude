<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fortitude</title>
<style>
  :root { --bg:#0e1116; --panel:#161b22; --line:#262d36; --ink:#d6dde6; --dim:#8b97a6; --accent:#c9a45c; --warn:#d77a61; --you:#7fb3d5; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif; height:100vh; display:flex; flex-direction:column; }
  header { display:flex; gap:24px; align-items:baseline; padding:10px 18px; border-bottom:1px solid var(--line); background:#0b0e12; }
  header h1 { font-size:15px; letter-spacing:.35em; margin:0; color:var(--accent); font-weight:600; }
  header .stat { color:var(--dim); } header .stat b { color:var(--ink); font-weight:500; }
  main { flex:1; display:grid; grid-template-columns: 300px 1fr 380px; min-height:0; }
  section { border-right:1px solid var(--line); overflow:auto; padding:14px 16px; }
  section:last-child { border-right:none; }
  h2 { font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--dim); margin:18px 0 8px; font-weight:600; }
  h2:first-child { margin-top:0; }
  .place { font-size:18px; color:var(--accent); }
  .desc { color:var(--dim); margin:4px 0 0; }
  .person { padding:6px 8px; border:1px solid var(--line); border-radius:6px; margin-bottom:6px; cursor:pointer; }
  .person:hover, .person.sel { border-color:var(--accent); }
  .person .n { font-weight:600; } .person .r { color:var(--dim); font-size:12px; } .person .a { color:var(--dim); font-size:12px; font-style:italic; }
  .asleep { opacity:.5; }
  button, select, input, textarea { font:inherit; color:var(--ink); background:#0f1318; border:1px solid var(--line); border-radius:6px; padding:5px 9px; }
  button { cursor:pointer; } button:hover { border-color:var(--accent); }
  button:disabled { opacity:.4; cursor:default; }
  .row { display:flex; gap:6px; flex-wrap:wrap; }
  .places button { margin:0 4px 4px 0; font-size:12px; }
  .places button.here { border-color:var(--accent); color:var(--accent); }
  #convo { display:flex; flex-direction:column; height:100%; }
  #lines { flex:1; overflow:auto; padding:6px 2px; }
  .line { margin:10px 0; max-width:85%; }
  .line .who { font-size:12px; color:var(--dim); }
  .line.you { margin-left:auto; text-align:right; } .line.you .t { color:var(--you); }
  .line .t { white-space:pre-wrap; }
  .note { color:var(--dim); font-style:italic; text-align:center; margin:10px 0; }
  #say { display:flex; gap:6px; margin-top:8px; } #say textarea { flex:1; resize:none; height:60px; }
  .entry { padding:7px 0; border-bottom:1px solid var(--line); }
  .entry .w { font-size:11px; color:var(--dim); }
  .entry.inv .t { color:#e8dcc3; }
  .entry.private .w::after { content:" · only you know"; color:var(--accent); }
  .fact { padding:5px 0; border-bottom:1px dashed var(--line); } .fact .h { color:var(--dim); font-size:12px; }
  .tabs button { font-size:12px; } .tabs button.on { border-color:var(--accent); color:var(--accent); }
  .toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:#20262f; border:1px solid var(--line); padding:8px 14px; border-radius:8px; color:var(--ink); display:none; }
  .muted { color:var(--dim); }
  #away { position:fixed; inset:0; background:rgba(5,7,10,.78); display:none; align-items:center; justify-content:center; z-index:10; }
  #away .card { width:min(640px, 92vw); max-height:84vh; overflow:auto; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:22px 26px; }
  #away h3 { margin:0 0 4px; color:var(--accent); font-weight:600; letter-spacing:.06em; }
  #away .prose { font-size:15px; line-height:1.6; margin:12px 0 16px; color:#e8dcc3; }
  #away .item { padding:8px 0; border-bottom:1px solid var(--line); }
  #away .item .w { font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.08em; }
  .entry.new .w::before { content:"new · "; color:var(--accent); }
  #bell { cursor:pointer; } #bell b { color:var(--accent); }
</style>
</head>
<body>
<header>
  <h1>FORTITUDE</h1>
  <span class="stat" id="time">—</span>
  <span class="stat">Board hull <b id="hull">—</b>%</span>
  <span class="stat">Morale <b id="morale">—</b></span>
  <span class="stat" id="bell" title="Messages while you were away">✉ <b id="unread">0</b></span>
  <span class="stat" style="margin-left:auto"><b id="me">—</b> · <span id="mood">—</span> · <span id="act">—</span></span>
</header>
<div id="away"><div class="card">
  <h3 id="awayTitle">While you were away</h3>
  <div class="muted" id="awaySpan"></div>
  <div class="prose" id="awayProse"></div>
  <div id="awayItems"></div>
  <div class="muted" id="awayStation" style="margin-top:12px"></div>
  <div style="margin-top:16px; text-align:right"><button id="awayClose">Back to the ring</button></div>
</div></div>
<main>
  <section>
    <h2>Where you are</h2>
    <div class="place" id="place">—</div>
    <p class="desc" id="pdesc"></p>
    <h2>Here</h2>
    <div id="here"><p class="muted">No one.</p></div>
    <h2>Do</h2>
    <div class="row">
      <button data-act="investigate">Search this place</button>
      <button data-act="work">Work</button>
      <button data-act="rest">Rest</button>
      <button id="observeBtn" disabled>Watch them</button>
    </div>
    <h2>Go</h2>
    <div class="places" id="places"></div>
    <h2>You intend to</h2>
    <div id="intents" class="muted">Nothing in particular.</div>
  </section>
  <section>
    <div id="convo">
      <h2 id="convoTitle">Talk to someone here</h2>
      <div id="lines"><p class="note">Pick someone from “Here”.</p></div>
      <div class="row">
        <select id="register" title="How you say it">
          <option value="open">openly</option><option value="guarded">quietly</option><option value="warm">warmly</option><option value="cold">coldly</option><option value="formal">formally</option>
        </select>
        <select id="reveals" title="Tell them something you know"><option value="">— tell them nothing in particular —</option></select>
      </div>
      <div id="say"><textarea id="text" placeholder="Say something…" disabled></textarea><button id="send" disabled>Say</button></div>
    </div>
  </section>
  <section>
    <div class="tabs row"><button class="on" data-tab="journal">Journal</button><button data-tab="knows">What you know</button><button data-tab="people">People</button></div>
    <div id="journal"></div>
    <div id="knows" hidden></div>
    <div id="people" hidden></div>
  </section>
</main>
<div class="toast" id="toast"></div>
<script>
const $ = (id) => document.getElementById(id)
let view = null, selected = null, journal = [], filter = 'all'
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const toast = (msg) => { const t = $('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => (t.style.display = 'none'), 3500) }
const api = (path, body) => fetch(path, body ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) } : {}).then((r) => r.json())

function render() {
  if (!view) return
  const v = view
  $('time').textContent = v.world.time
  $('hull').textContent = v.world.boardHull
  $('morale').textContent = v.world.morale
  $('me').textContent = v.you.name
  $('mood').textContent = v.you.mood
  $('act').textContent = v.you.asleep ? 'asleep' : v.you.activity
  $('place').textContent = v.you.location.name
  $('pdesc').textContent = v.you.location.description
  $('here').innerHTML = v.here.length
    ? v.here.map((p) => `<div class="person ${p.asleep ? 'asleep' : ''} ${selected === p.id ? 'sel' : ''}" data-id="${p.id}">
        <div class="n">${esc(p.name)} <span class="r">· ${esc(p.role)} · ${esc(p.relationship)}</span></div>
        <div class="a">${p.asleep ? 'asleep' : esc(p.activity)}</div></div>`).join('')
    : '<p class="muted">No one.</p>'
  $('places').innerHTML = v.places.filter((p) => p.open).map((p) => `<button class="${p.here ? 'here' : ''}" data-go="${p.id}" ${p.here ? 'disabled' : ''}>${esc(p.name.replace(/^The /, ''))}</button>`).join('')
  $('intents').innerHTML = v.intents.length ? v.intents.map((i) => `<div>${esc(i.kind)} ${esc(i.target ?? i.to ?? '')} <span class="muted">until ${esc(i.until)}</span></div>`).join('') : 'Nothing in particular.'
  $('reveals').innerHTML = '<option value="">— tell them nothing in particular —</option>' + v.knows.map((k) => `<option value="${k.id}">Tell: ${esc(k.text)}</option>`).join('')
  $('knows').innerHTML = v.knows.length ? v.knows.map((k) => `<div class="fact">${esc(k.text)}<div class="h">${esc(k.how)}</div></div>`).join('') : '<p class="muted">Nothing worth repeating. Yet.</p>'
  $('people').innerHTML = v.people.map((p) => `<div class="fact">${esc(p.name)} <span class="muted">· ${esc(p.role)}</span><div class="h">${p.met ? esc(p.relationship) : 'not met'}</div></div>`).join('')
  const sel = v.here.find((p) => p.id === selected)
  if (selected && !sel) { selectPerson(null) }
  $('observeBtn').disabled = !sel
  $('text').disabled = $('send').disabled = !sel || v.you.asleep
}

let sinceTick = Infinity
function renderJournal() {
  const rows = journal.filter((e) => filter === 'all' || e.involved)
  $('journal').innerHTML = rows.length ? rows.map((e) => `<div class="entry ${e.involved ? 'inv' : ''} ${e.privateToYou ? 'private' : ''} ${e.tick > sinceTick ? 'new' : ''}"><div class="w">${esc(e.when)}${e.place ? ' · ' + esc(e.place) : ''}</div><div class="t">${esc(e.text)}</div></div>`).join('') : '<p class="muted">Nothing yet.</p>'
}

const KIND = { learned: 'You learned', rumour: 'You heard', sought: 'Someone came for you', involved: 'You were there', incident: 'On the station', feeling: 'You' }
async function showDebrief() {
  const d = await api('/api/debrief?prose=1')
  sinceTick = d.since.tick
  if (d.away.hours < 2 || (!d.headline.length && !d.station.incidents.length)) return
  $('awaySpan').textContent = `${d.since.when} → ${d.now.when} · ${d.away.days >= 1 ? d.away.days + ' days' : d.away.hours + ' hours'} on the ring without you`
  $('awayProse').textContent = d.prose ?? ''
  $('awayItems').innerHTML = d.headline.map((i) => `<div class="item"><div class="w">${esc(KIND[i.kind] ?? i.kind)} · ${esc(i.when)}${i.place ? ' · ' + esc(i.place) : ''}</div>${esc(i.text)}</div>`).join('')
  $('awayStation').textContent = d.station.boardHullThen != null ? `The board went from ${d.station.boardHullThen}% to ${d.station.boardHullNow}%. ${d.counts.journal} things reached you; ${d.counts.involvingYou} involved you.` : ''
  $('away').style.display = 'flex'
}
$('awayClose').onclick = () => ($('away').style.display = 'none')

async function refreshBell() {
  const n = await api('/api/notifications')
  $('unread').textContent = n.unread
  $('bell').onclick = async () => {
    if (!n.notifications.length) return toast('No messages.')
    $('awaySpan').textContent = 'Messages that reached you while you were away'
    $('awayProse').textContent = ''
    $('awayItems').innerHTML = n.notifications.map((x) => `<div class="item"><div class="w">${x.read ? '' : 'new · '}tick ${x.tick}</div>${esc(x.text)}</div>`).join('')
    $('awayStation').textContent = ''
    $('away').style.display = 'flex'
    await api('/api/notifications/read', {})
    $('unread').textContent = 0
  }
}

async function selectPerson(id) {
  selected = id
  const p = view?.here.find((x) => x.id === id)
  $('convoTitle').textContent = p ? `Talking with ${p.name}` : 'Talk to someone here'
  $('lines').innerHTML = p ? '' : '<p class="note">Pick someone from “Here”.</p>'
  if (p) {
    const t = await api(`/api/transcript/${id}`)
    for (const l of t.lines) addLine(l.speaker === view.you.name, l.speaker, l.line)
    if (!t.lines.length) $('lines').innerHTML = `<p class="note">${esc(p.name)} ${p.asleep ? 'is asleep.' : 'is ' + esc(p.activity.toLowerCase()) + '.'}</p>`
  }
  render()
}

function addLine(you, who, text) {
  const d = document.createElement('div')
  d.className = 'line' + (you ? ' you' : '')
  d.innerHTML = `<div class="who">${esc(you ? 'You' : who)}</div><div class="t">${esc(text)}</div>`
  $('lines').appendChild(d); $('lines').scrollTop = 1e9
}
function addNote(text) { const d = document.createElement('p'); d.className = 'note'; d.textContent = text; $('lines').appendChild(d); $('lines').scrollTop = 1e9 }

async function send() {
  const text = $('text').value.trim(); if (!text || !selected) return
  const to = selected, name = view.here.find((p) => p.id === to)?.name ?? to
  $('text').value = ''; $('send').disabled = true
  addLine(true, 'You', text)
  addNote('…')
  const r = await api('/api/say', { to, text, register: $('register').value, reveals: $('reveals').value || undefined })
  $('lines').lastChild.remove()
  if (!r.ok) addNote(r.error)
  else { if (r.reply) addLine(false, name, r.reply); if (r.note) addNote(r.note); if (r.revealed) addNote(`(${name} told you something. It will be in your journal.)`) }
  $('reveals').value = ''; $('send').disabled = false
}

async function act(body) { const r = await api('/api/act', body); toast(r.ok ? `You'll ${body.kind}${body.to ? ' → ' + body.to : ''}${body.target ? ' ' + body.target : ''} (${r.appliesAt}).` : r.error) }

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-id],[data-go],[data-act],[data-tab]')
  if (!t) return
  if (t.dataset.id) selectPerson(t.dataset.id)
  if (t.dataset.go) act({ kind: 'move', to: t.dataset.go })
  if (t.dataset.act === 'investigate') act({ kind: 'investigate', to: view.you.location.id })
  else if (t.dataset.act) act({ kind: t.dataset.act })
  if (t.dataset.tab) {
    for (const b of document.querySelectorAll('[data-tab]')) b.classList.toggle('on', b === t)
    for (const id of ['journal', 'knows', 'people']) $(id).hidden = id !== t.dataset.tab
  }
})
$('observeBtn').onclick = () => selected && act({ kind: 'observe', target: selected })
$('send').onclick = send
$('text').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send() } })

async function boot() {
  // Debrief first: opening the stream marks you present and closes the "away" window.
  await showDebrief()
  await refreshBell()
  view = await api('/api/state')
  journal = (await api('/api/journal?limit=80')).entries
  render(); renderJournal()
  const es = new EventSource('/api/stream')
  es.addEventListener('tick', (ev) => {
    const d = JSON.parse(ev.data)
    view = d.view
    if (typeof d.unread === 'number') $('unread').textContent = d.unread
    const seen = new Set(journal.map((e) => e.id))
    journal = [...d.entries.filter((e) => !seen.has(e.id)), ...journal].slice(0, 300)
    render(); renderJournal()
  })
}
boot()
</script>
</body>
</html>
